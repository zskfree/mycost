name = "mycost"
main = "worker/index.ts"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
APP_NAME = "MyCost"

[[d1_databases]]
binding = "DB"
database_name = "mycost"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
